app = "musyami-api"
primary_region = "sin"

[env]
  PORT = "3001"
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  DATA_DIR = "/app/data"
  UPLOAD_DIR = "/app/uploads"
  CORS_ORIGIN = "https://portofolio-musyami.vercel.app"

[mounts]
  source = "musyami_data"
  destination = "/app/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
